# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend \
            ${LAYERDIR}/recipes-*/*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*/*.bbappend"

BBFILE_COLLECTIONS += "rz-drpai"
BBFILE_PATTERN_rz-drpai := "^${LAYERDIR}/"

LAYERDEPENDS_rz-drpai:rzv2n-family = "core meta-rz-bsp meta-rz-distro"
LAYERDEPENDS_rz-drpai:rzv2h-family = "core meta-rz-bsp meta-rz-distro"
LAYERDEPENDS_rz-drpai:smarc-rzv2l = "meta-rz-bsp"
LAYERSERIES_COMPAT_rz-drpai = "scarthgap"
